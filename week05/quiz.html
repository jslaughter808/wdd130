<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML & CSS Knowledge Quiz</title>
    <link rel="stylesheet" href="../styles/quiz.css">
</head>

<body>

    <h1>HTML & CSS Online Quiz</h1>

    <form>

        <!-- Question 1: Text Input -->
        <div class="form-group">
            <label for="q1">1. What does HTML stand for?</label>
            <input type="text" id="q1" name="q1">
        </div>

        <!-- Question 2: Textarea -->
        <div class="form-group">
            <label for="q2">2. Describe the purpose of CSS in web development.</label>
            <textarea id="q2" name="q2" rows="4"></textarea>
        </div>

        <!-- Question 3: Select Dropdown -->
        <div class="form-group">
            <label for="q3">3. Which HTML element is used to create a hyperlink?</label>
            <select id="q3" name="q3">
                <option value="" selected disabled>Choose One ...</option>
                <option value="a">&lt;a&gt;</option>
                <option value="link">&lt;link&gt;</option>
                <option value="href">href</option>
            </select>
        </div>

        <!-- Question 4: Number Input -->
        <div class="form-group">
            <label for="q4">4. In CSS, what number represents the highest heading level? (Use an
                integer)</label>
            <input type="number" id="q4" name="q4" min="1" max="6">
        </div>

        <button type="submit">Submit Quiz</button>

    </form>

</body>

</html>
